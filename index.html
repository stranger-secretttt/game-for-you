<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spesial Buat Kamu ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f5;
            --box-bg: #ffffff;
            --primary-color: #ffb6c1;
            --secondary-color: #ff69b4;
            --text-color: #555555;
            --accent-color: #ff1493;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Quicksand', sans-serif;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--box-bg);
            border: 4px solid var(--secondary-color);
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 16px;
            color: var(--accent-color);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .pixel-art {
            font-size: 50px;
            margin: 15px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-8px); }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--secondary-color);
            transform: scale(1.05);
        }

        .card-box {
            background: #fff8fb;
            border: 2px dashed var(--secondary-color);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .spotify-wrapper {
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            display: none; /* Awalnya disembunyikan sampai tombol diklik */
        }
    </style>
</head>
<body>

    <!-- HALAMAN PERTAMA (TOMBOL PEMBUKA AGAR MUSIK BISA NYALA OTOMATIS) -->
    <div class="container" id="welcome-screen">
        <div class="pixel-art">💌✨</div>
        <h1>Ada Pesan Khusus Buat Kamu!</h1>
        <p>Sebelum masuk, pencet tombol di bawah dulu ya. ✨</p>
        <button onclick="mulaiWeb()" style="font-size: 18px; padding: 15px 30px;">🎁 Buka Sesuatu</button>
    </div>

    <!-- HALAMAN UTAMA (SETELAH TOMBOL DIKLIK) -->
    <div class="container" id="main-container" style="display: none;">
        <div class="pixel-art">🐱💖🐶</div>
        <h1>Haii, Seseorang yang Gemesin! 👋</h1>
        <p>Aku bikin khusus buat kamu nih. Isinya hal-hal seru. Mau lihat apa isi di dalamnya?</p>
        
        <div class="btn-group">
            <button onclick="bukaMenu('kuis')">✨ Kuis Gombal</button>
            <button onclick="bukaMenu('pesan')">💌 Pesan Rahasia</button>
            <button onclick="bukaMenu('gombalan')">🌸 Kata-kata Manis</button>
        </div>
    </div>

    <!-- PEMUTAR MUSIK SPOTIFY (MUNCUL OTOMATIS SETELAH TOMBOL DIKLIK) -->
    <div class="spotify-wrapper" id="spotify-box">
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/track/3be9ACTxtcL6Zm4vJRUiPG?utm_source=generator&theme=0&autoplay=1" width="100%" height="80" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script>
        function mulaiWeb() {
            // Sembunyikan layar awal, tampilkan menu utama dan pemutar Spotify
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('main-container').style.display = 'block';
            document.getElementById('spotify-box').style.display = 'block';
        }

        function bukaMenu(menu) {
            const container = document.getElementById('main-container');
            
            if (menu === 'kuis') {
                container.innerHTML = `
                    <h1>✨ Kuis Gombal Tipis-Tipis ✨</h1>
                    <p><b>Seberapa gemesin sih kamu di mata orang-orang?</b></p>
                    <div class="btn-group">
                        <button onclick="jawabKuis(1)">Overload (Parah banget)</button>
                        <button onclick="jawabKuns(2)" onclick="jawabKuis(2)">Natural dari lahir</button>
                    </div>
                    <br><br>
                    <button onclick="kembaliKeUtama()" style="background-color: #ccc;">⬅️ Kembali</button>
                `;
            } else if (menu === 'pesan') {
                container.innerHTML = `
                    <h1>💌 Pesan Rahasia Buat Kamu</h1>
                    <div class="card-box">
                        <p>Makasih ya udah jadi salah satu alasan aku sering senyum-senyum sendiri belakangan ini. Tetap jadi diri kamu yang lucu dan ceria, ya! ✨</p>
                    </div>
                    <br>
                    <button onclick="kembaliKeUtama()" style="background-color: #ccc;">⬅️ Kembali</button>
                `;
            } else if (menu === 'gombalan') {
                const listGombal = [
                    "Kamu itu kayak teka-teki silang, susah ditebak tapi bikin penasaran terus. 🧩",
                    "Tau nggak bedanya kamu sama jam 12 siang? Kalau jam 12 siang kesiangan, kalau kamu kesayangan. ☀️",
                    "Selain 'To Do List', hal yang paling pengen aku selesaikan hari ini adalah bikin kamu tersenyum. ☕",
                    "Jangan sering-sering senyum gitu, nanti aku makin betah mikirin kamu seharian. 🌻"
                ];
                const randomGombal = listGombal[Math.floor(Math.random() * listGombal.length)];
                container.innerHTML = `
                    <h1>🌸 Kata-kata Manis Hari Ini</h1>
                    <div class="card-box">
                        <p style="text-align: center; font-weight: bold; color: #ff1493;">"${randomGombal}"</p>
                    </div>
                    <br>
                    <button onclick="bukaMenu('gombalan')">🔄 Putar Kata Lain</button>
                    <button onclick="kembaliKeUtama()" style="background-color: #ccc;">⬅️ Kembali</button>
                `;
            }
        }

        function jawabKuis(pilihan) {
            const container = document.getElementById('main-container');
            let teksHasil = pilihan === 1 ? "Bener banget! Emang udah level maksimal gemesnya. 😆" : "Setuju! Nggak perlu usaha pun emang udah menggemaskan. ✨";
            
            container.innerHTML = `
                <h1>✨ Hasil Kuis ✨</h1>
                <div class="card-box">
                    <p style="text-align: center;"><b>${teksHasil}</b></p>
                </div>
                <br>
                <button onclick="kembaliKeUtama()">⬅️ Kembali ke Menu Utama</button>
            `;
        }

        function kembaliKeUtama() {
            location.reload();
        }
    </script>

</body>
</html>
